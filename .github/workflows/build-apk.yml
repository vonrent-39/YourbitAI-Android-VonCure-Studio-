name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project from ZIP
        if: hashFiles('gradlew') == ''
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No sources and no ZIP in the repository root"
            exit 1
          fi
          unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/unpacked"
          GRADLEW=$(find "$RUNNER_TEMP/unpacked" -maxdepth 3 -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found in the archive"
            exit 1
          fi
          cp -a "$(dirname "$GRADLEW")"/. .

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set, building with the debug key"
          fi

      - name: Fetch llama.cpp
        run: |
          DIR="app/src/main/cpp/llama.cpp"
          if [ ! -f "$DIR/CMakeLists.txt" ]; then
            git clone --depth 1 https://github.com/ggml-org/llama.cpp "$DIR"
          fi
          echo "llama.cpp commit: $(git -C "$DIR" rev-parse HEAD)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973 cmake;3.22.1
          accept-android-sdk-licenses: true

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Collect APK
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::APK not found"
            exit 1
          fi
          mkdir -p out
          cp "$APK" out/YourbitAI-debug.apk
          ls -lh out

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            FLAGS=""
          else
            TAG="build-${{ github.run_number }}"
            FLAGS="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/YourbitAI-debug.apk --clobber
          else
            gh release create "$TAG" out/YourbitAI-debug.apk \
              --target "${{ github.sha }}" \
              --title "Yourbit AI $TAG" \
              --generate-notes \
              $FLAGS
          fi
          echo "APK: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
